[package]
name = "soundings"
version = "0.1.0"
description = "See everything on your Windows PC: disk map, duplicates, apps, dev tools, games and crash history."
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
winreg = "0.52"
trash = "5"
blake3 = "1"

[dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_Foundation",
  "Win32_System_EventLog",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemInformation",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
