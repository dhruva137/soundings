ShortDescription: A calm, read-only look at your Windows PC.
Description: >-
  Soundings shows what is on your Windows PC and what has been going wrong with it: a map of the whole
  drive, large, old and duplicate files, installed apps by origin, developer runtimes and caches, games,
  and blue screens / GPU resets on one timeline. It never deletes anything, makes no network
  connections, and can optionally answer questions for Claude through a read-only MCP server.
